<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="modulepreload" href="/js/index.js">
    <link rel="modulepreload" href="/js/d3.esm.min.js">
    <link rel="modulepreload" href="/js/plot.esm.min.js">
    <link rel="modulepreload" href="/js/sqlite-wasm-3510100/jswasm/sqlite3.mjs">
    <link rel="stylesheet" href="/css/spinner.css">
    <link rel="stylesheet" href="/css/summary.css">
</head>

<body>
    <div id="chart">
        <div id="plot"></div>
        <div id="cost-summary">
            <div class="column">
                <div class="section-header">Time</div>
                <div class="label">Period</div>
                <div class="value secondary"><span id="val-period">-</span> <span class="unit">hours</span></div>
            </div>
            <div class="column">
                <div class="section-header">Energy</div>
                <div class="label">Total</div>
                <div class="value secondary"><span id="val-power-total">-</span> <span class="unit">kWh</span></div>
                <div class="label">Average Power</div>
                <div class="value secondary"><span id="val-power-avg">-</span> <span class="unit">kW</span></div>
                <div class="label">Maximum Power</div>
                <div class="value secondary"><span id="val-power-max">-</span> <span class="unit">kW</span></div>
            </div>
            <div class="column">
                <div class="section-header">Cost</div>
                <div class="label">Total</div>
                <div class="value" id="val-cost-total">-</div>
                <div class="label">Average Hourly Price</div>
                <div class="value secondary"><span id="val-cost-hourly">-</span> <span class="unit">per hour</span></div>
                <div class="label">Equivalent Price</div>
                <div class="value secondary"><span id="val-cost-price">-</span> <span class="unit">p/kWh</span></div>
            </div>
        </div>
        <div class="spinner"></div>
    </div>

    <script type="module" src="/js/index.js"></script>
</body>
</html>
